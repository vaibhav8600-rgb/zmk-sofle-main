# NEXUS dongle overrides for this keyboard.
#
# Applied on top of two files that come from the shields themselves:
#   config/boards/shields/sofle/central_dongle.conf  (BLE, split, display bus)
#   <nexus>/boards/shields/nexus_dongle/nexus_dongle.conf  (NEXUS defaults)
#
# Only what has to differ lives here. Nothing in this file edits NEXUS source,
# and nothing here affects the snake_dongle build - central_dongle.conf is
# shared, this file is not.

# --- Identity -------------------------------------------------------------
# central_dongle.conf sets "Snake". This is a different firmware, so it gets a
# different BLE name - otherwise you cannot tell which one your host paired to.
CONFIG_ZMK_KEYBOARD_NAME="NEXUS"

# --- Branding (Section 22) ------------------------------------------------
CONFIG_NEXUS_BRAND="VAIBHAV TECH"
CONFIG_NEXUS_PRODUCT="NEXUS"
CONFIG_NEXUS_SUBTITLE="SMART ZMK DONGLE"

# --- Look -----------------------------------------------------------------
# NEXUS, AMOLED, DAYLIGHT, CLAY, ESPRESSO, MINT, SUNSET
CONFIG_NEXUS_THEME="NEXUS"
CONFIG_NEXUS_DEFAULT_SCREEN_HOME=y
CONFIG_NEXUS_ANIMATIONS=y

# Panel orientation. This dongle mounts the ST7789 upside down, so the UI
# needs a half turn. Measured on hardware, not guessed.
#
# Done in software by the compositor: all drawing stays in logical top-left
# coordinates and no screen has to know (Section 8). 180 does not need the
# transpose buffer that 90/270 do - it reverses each band in place - so the
# cost here is close to nothing.
#
# The zero-cost alternative is the panel's own MADCTL byte (`mdac` in the
# shield overlay, 0xC0 for a half turn), which is deliberately NOT used here:
# a 240x240 ST7789 is a 240x320 controller showing a window, so flipping in
# hardware also needs y-offset = 80, and getting that wrong shifts the image
# instead of rotating it. Software rotation has no such trap.
CONFIG_NEXUS_DISPLAY_ROTATION=180

# --- Splash (Sections 19-21) ---------------------------------------------
CONFIG_NEXUS_SPLASH=y
CONFIG_NEXUS_SPLASH_DURATION_MS=3500
# Drop a PNG in config/ and point at it, relative to this directory. Leave it
# empty for the built-in drawn mark, which costs ~200 B instead of ~51 KB and
# follows the active theme.
# CONFIG_NEXUS_SPLASH_IMAGE="nexus/splash/splash.png"
CONFIG_NEXUS_SPLASH_MAX_DIM=160

# --- Sound ----------------------------------------------------------------
# Same passive buzzer on the same pin the Snake build drives (P0.29).
CONFIG_NEXUS_SOUND=y
CONFIG_NEXUS_UI_SOUND=y
CONFIG_NEXUS_GAME_SOUND=y
CONFIG_NEXUS_SOUND_STARTUP=y

# Half connect/disconnect chirps, plus a slower pair for deep sleep and wake.
# Rising = arrived, falling = gone, left a fifth below right.
CONFIG_NEXUS_SOUND_SPLIT=y

# --- Games ----------------------------------------------------------------
CONFIG_NEXUS_GAME_CENTER=y
CONFIG_NEXUS_TETRIS=y
CONFIG_NEXUS_GAME_HIGHSCORE_PERSIST=y

# --- Action button --------------------------------------------------------
CONFIG_NEXUS_BUTTON=y
CONFIG_NEXUS_BUTTON_DEBOUNCE_MS=30
CONFIG_NEXUS_BUTTON_LONG_PRESS_MS=600

# --- Mouse jiggler indicator ----------------------------------------------
# The &anti_idle behavior comes from snake-module, which this config already
# pulls in for the shared keymap, so the dashboard can show whether the
# jiggler is on. Off by default in NEXUS because that module is not a NEXUS
# dependency - see Kconfig.
CONFIG_NEXUS_ANTI_IDLE_STATUS=y

# --- Status ---------------------------------------------------------------
# ZMK numbers peripherals by pairing order, not by physical side. If the
# dashboard shows the halves the wrong way round, uncomment this rather than
# re-pairing anything.
# CONFIG_NEXUS_SPLIT_SWAP_SIDES=y

# How long a half may stay quiet before it is called gone - which is what
# fires the disconnect chirp. This is inference, not observation: ZMK's split
# central raises no events at all, so silence is the only evidence the dongle
# ever gets that a half went away.
#
# central_dongle.conf sets CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60, so a half
# checks in once a minute. 150 s is 2.5 of those - short enough to notice,
# long enough not to chirp at a half that is merely between reports. Drop it
# below ~120000 and you will get false disconnects.
#
# config/sofle.conf sets CONFIG_ZMK_SLEEP=y, so a dozing half also stops
# reporting and will be announced as disconnected, then connected again when
# you touch it. The dongle cannot tell sleep from absence, and for a chirp the
# difference does not matter: either way that half is not there right now.
CONFIG_NEXUS_STATUS_LINK_TIMEOUT_MS=150000

# --- ZMK Studio (Sections 30-32) -----------------------------------------
# The studio-rpc-usb-uart snippet in build.yaml supplies the USB transport.
CONFIG_ZMK_STUDIO=y

# --- Display buffer -------------------------------------------------------
# central_dongle's Kconfig.defconfig defaults LV_Z_VDB_SIZE to 64, which would
# hand LVGL ~74 KB of RAM to draw nothing: NEXUS composites straight to the
# panel from a 5,760-byte static band and LVGL only holds one empty object.
# Pinned here because a .conf beats every Kconfig default regardless of the
# order the shields happen to be parsed in. (central_dongle.conf already pins
# the same value, so this is belt-and-braces rather than the only guard.)
CONFIG_LV_Z_VDB_SIZE=10

# --- Kernel heap ----------------------------------------------------------
# INHERITED, AND PROBABLY TOO BIG FOR THIS BUILD.
#
# central_dongle.conf sets CONFIG_HEAP_MEM_POOL_SIZE=65536 - 64 KB, a quarter
# of the chip's RAM. That was sized for the Snake UI, which allocated at
# runtime. NEXUS does not: every buffer it owns is static (about 6.4 KB total,
# the 5,760-byte compositor band being nearly all of it), so none of that heap
# is being used on NEXUS's behalf.
#
# It is left at the inherited value on purpose. ZMK Studio's RPC and the
# settings subsystem do allocate, and guessing their peak wrong shows up as an
# allocation failure at an awkward moment rather than at build time - which is
# exactly the trade Section 100 says not to make backwards.
#
# If you are short of RAM, this is the single biggest thing to reclaim and the
# right way to do it is empirically: uncomment, drop it a step at a time, and
# exercise Studio (connect, unlock, edit a keymap, save) plus a full Tetris
# round after each step.
#
# CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- Logging (Section 65) -------------------------------------------------
CONFIG_ZMK_USB_LOGGING=n
CONFIG_NEXUS_DEBUG=n
