# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:

---
include:
  # --- Existing Snake dongle. Unchanged, still the default build. ----------
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle snake_adapter
    artifact-name: snake_dongle

  # --- NEXUS dongle -------------------------------------------------------
  # Same physical dongle, same central_dongle shield (kscan mock, matrix
  # transform, encoders, central role) - only the UI module differs, so the
  # keymap resolves exactly as it does for the Snake build.
  #
  # Flash EITHER snake_dongle OR nexus_dongle, never both; they are two
  # firmwares for one piece of hardware.
  #
  # NOTE: the NEXUS module's own CI builds nexus_dongle + nexus_dongle_demo.
  # This entry is the first thing to build central_dongle + nexus_dongle
  # together, so if anything here fails it is config-level - the module's C
  # code is already proven green upstream.
  #
  # Studio is a NEXUS requirement (Sections 30-32) and stays on. The snippet
  # is the transport it needs; CONFIG_ZMK_STUDIO=y and the BLE-transport
  # override live in config/nexus_dongle.conf.
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: nexus_dongle

  # TEMPORARY, for the blank-screen report after Remote Input: the same
  # firmware with Remote Input switched off. If nexus_dongle is still blank
  # and this one boots, the fault is in Remote Input; if this one is blank
  # too, it is not - it came in with the ZMK main the build pulled. Delete
  # this entry once the dongle is back.
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_NEXUS_REMOTE_INPUT=n
    artifact-name: nexus_dongle_no_remote

  # TEMPORARY, same report. nexus_dongle_extadv_only (all four Bluetooth
  # settings Remote Input switches on, none of its code) froze before USB came
  # up, so the freeze is in Bluetooth start-up. One setting per firmware, to
  # find which; flash each, note black or boots.
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_NEXUS_REMOTE_INPUT=n -DCONFIG_BT_EXT_ADV=y -DCONFIG_BT_EXT_ADV_MAX_ADV_SET=2
    artifact-name: nexus_test1_extadv
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_NEXUS_REMOTE_INPUT=n -DCONFIG_BT_ID_MAX=2
    artifact-name: nexus_test2_identity
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_NEXUS_REMOTE_INPUT=n -DCONFIG_BT_GATT_AUTHORIZATION_CUSTOM=y
    artifact-name: nexus_test3_authz
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_NEXUS_REMOTE_INPUT=n -DCONFIG_MAIN_STACK_SIZE=2048
    artifact-name: nexus_test4_stack

  # TEMPORARY, same report. Full Remote Input plus a USB serial boot log, with
  # Bluetooth started AFTER USB (priority 97 instead of 50), so the log port
  # exists before the freeze and can show it. Open the new COM port at 115200
  # in PuTTY as soon as it appears.
  - board: nice_nano@2.0.0//zmk
    shield: central_dongle nexus_dongle
    cmake-args: -DSNIPPET='studio-rpc-usb-uart;zmk-usb-logging' -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_ZMK_BLE_INIT_PRIORITY=97 -DCONFIG_NEXUS_LOG_LEVEL_DBG=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000 -DCONFIG_LOG_BUFFER_SIZE=4096
    artifact-name: nexus_dongle_debug_log

  # --- Halves. Neither compiles a single line of NEXUS. --------------------
  - board: nice_nano@2.0.0//zmk
    shield: sofle_left_peripheral nice_view_adapter nice_view_gem
    artifact-name: sofle_left_peripheral
  - board: nice_nano@2.0.0//zmk
    shield: sofle_right nice_view_adapter nice_view_gem
    artifact-name: sofle_right
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset
